
name: Generar APK Wave Rush

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar proyecto
        run: |
          FILE=$(find . -name package.json -not -path '*/node_modules/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "Falta package.json. Sube el proyecto completo."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Dependencias
        run: cd "$PROJECT_DIR" && npm install

      - name: Android
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WaveRush-APK
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
